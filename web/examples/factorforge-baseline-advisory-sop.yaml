# FactorForge Advisory Baseline Sequence Policy
#
# $schema: factorforge-policy-v1
# This is the "Unopinionated Baseline" policy for FactorForge.
# It enforces strict invariants and contextual constraints but treats all
# probabilistic biological predictions (like cryptic splices) as WARNINGs.
#
# Use this as a starting point to build your laboratory's approved policy.
# For example, if your laboratory empirically determines that Cryptic Splice
# sites reduce yield, you may elevate `rna.cryptic_splice.v1`'s authorized_action
# to REGENERATE.

$schema: factorforge-policy-v1
policy_id: factorforge_advisory_baseline_v1
policy_name: "FactorForge Advisory Baseline Policy"
version: 1.0.0
author: Eijex FactorForge System
status: BUILTIN_BASELINE
derived_from: "First principles constraints and unopinionated baseline"
scope_note: "Strict on active contextual conflicts (BLOCK). Unopinionated on predictive heuristics (WARNING + REPORT_ONLY)."
default_enforcement: IGNORE
unknown_rule_policy: ERROR

rules:
  # ───────────────────────────────────────────────────────────
  # Contextual Hard Constraints
  # These block synthesis or assembly ONLY when the relevant 
  # context (e.g., Run Configuration) requires it.
  # ───────────────────────────────────────────────────────────
  assembly.type_iis.bsai.v1:
    enforcement: HARD_FAIL
    authorized_action: BLOCK
  assembly.type_iis.bpii.v1:
    enforcement: HARD_FAIL
    authorized_action: BLOCK
  assembly.type_iis.bsmbi.v1:
    enforcement: HARD_FAIL
    authorized_action: BLOCK
  synthesis.gc_extremes.v1:
    enforcement: HARD_FAIL
    authorized_action: BLOCK
  
  # ───────────────────────────────────────────────────────────
  # Biological Predictions (Predictive Proxies & Heuristics)
  # These are warnings to inform the user, but do not force 
  # sequence regeneration by default.
  # ───────────────────────────────────────────────────────────
  rna.cryptic_splice.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY
  rna.polya_motifs.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY
  rna.au_rich_elements.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY
  policy.synthesis.homopolymer.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY
  policy.initiation_mfe.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY

  # ───────────────────────────────────────────────────────────
  # Coding Sequence Distribution (Doug's Feedback)
  # Flags extreme collapse of synonymous codon usage.
  # ───────────────────────────────────────────────────────────
  coding.synonymous_codon_concentration.v1:
    enforcement: WARNING
    authorized_action: REPORT_ONLY
