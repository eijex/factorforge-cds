# FactorForge Advisory Baseline Sequence Policy
#
# $schema: factorforge-sop-v1
# This is the "Unopinionated Baseline" policy for FactorForge.
# It enforces strict physical/synthesis constraints but treats all
# probabilistic biological predictions (like cryptic splices) as WARNINGs.
#
# Use this as a starting point to build your laboratory's approved SOP.
# For example, if your laboratory empirically determines that Cryptic Splice
# sites reduce yield, you may elevate `rna.cryptic_splice.v1` to REGENERATE.

$schema: factorforge-sop-v1
profile_id: factorforge_advisory_baseline_v1
sop_name: "FactorForge Advisory Baseline Policy"
version: 1.0.0
author: Eijex FactorForge System
status: SYSTEM_DEFAULT
derived_from: "First principles synthesis constraints; no biological assumptions"
scope_note: "Strict on synthesis/assembly failures (BLOCK/REGENERATE). Unopinionated on predictive heuristics (WARNING only)."
default_enforcement: IGNORE
unknown_rule_policy: ERROR

rules:
  # TIER 1: Physical / Synthesis Constraints (100% empirical certainty)
  # These are hard blockers for synthesis and assembly.
  assembly.type_iis.bsai.v1: HARD_FAIL
  assembly.type_iis.bpii.v1: HARD_FAIL
  assembly.type_iis.bsmbi.v1: HARD_FAIL
  synthesis.gc_extremes.v1: HARD_FAIL
  
  # TIER 2: Probabilistic Predictive Proxies (Biological heuristics)
  # These are warnings to inform the user, but do not force sequence regeneration.
  rna.cryptic_splice.v1: WARNING
  rna.polya_motifs.v1: WARNING
  rna.au_rich_elements.v1: WARNING
  policy.synthesis.homopolymer.v1: WARNING
  policy.initiation_mfe.v1: WARNING

workflow:
  design_method: feasibility_best
  comparison_methods: [high_cai, gc_target, assembly_friendly]
  sequence_requirements:
    reproducibility_seed: null
    kozak_optimization: false
    suppress_tpa: false
    type_iis_enzymes: [BsaI, BpiI, BsmBI]
    custom_restriction_sites: []
    moclo_template: false
  review_policy:
    cai: PREFERRED
    overall_gc: PREFERRED
    local_gc: PREFERRED
    type_iis: REQUIRED
    repeats: PREFERRED
    homopolymers: PREFERRED
    forbidden_motifs: PREFERRED
