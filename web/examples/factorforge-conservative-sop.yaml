# FactorForge conservative sequence-policy example
#
# How to use:
# 1. Save a copy of this file and edit the values below in a text editor.
# 2. Keep $schema and unknown_rule_policy unchanged so unsupported rules fail closed.
# 3. Upload the edited .yaml file in the FactorForge Sequence Policy panel.
#
# This is an illustrative in-silico template, not an approved laboratory SOP.
# Enforcement values are examples only. Adapt them to your own laboratory,
# assembly, and validation requirements.
# FactorForge always enforces CDS-integrity invariants such as a valid reading
# frame and amino-acid preservation; those invariants are not user policy.
# Do not add raw sequences, construct IDs, patient data, or confidential details.

$schema: factorforge-sop-v1
profile_id: example_conservative_plant_expression
sop_name: "FactorForge Conservative Sequence Policy Example"
version: 1.2.0
author: Eijex
status: EXAMPLE_TEMPLATE
derived_from: "Eijex FactorForge example defaults; not derived from a partner laboratory SOP"
scope_note: "Illustrative in-silico sequence-design and pre-synthesis review policy. Laboratory approval and wet-lab validation remain separate."
default_enforcement: IGNORE
unknown_rule_policy: ERROR

# Sequence-review policy: how advisory findings should be classified.
rules:
  assembly.type_iis.bsai.v1: HARD_FAIL
  assembly.type_iis.bpii.v1: HARD_FAIL
  assembly.type_iis.bsmbi.v1: HARD_FAIL
  rna.cryptic_splice.v1: WARNING
  rna.polya_motifs.v1: WARNING
  rna.au_rich_elements.v1: WARNING
  synthesis.gc_extremes.v1: WARNING
  policy.synthesis.homopolymer.v1: WARNING
  policy.initiation_mfe.v1: WARNING

# Optimization-workflow settings are transported in the same v1 file for web
# compatibility, but they are distinct from the sequence-review policy above.
workflow:
  design_method: feasibility_best
  comparison_methods: [high_cai, gc_target, assembly_friendly]
  sequence_requirements:
    reproducibility_seed: null
    kozak_optimization: false
    suppress_tpa: false
    type_iis_enzymes: [BsaI, BpiI, BsmBI]
    custom_restriction_sites: []
    moclo_template: false
  review_policy:
    cai: PREFERRED
    overall_gc: PREFERRED
    local_gc: PREFERRED
    type_iis: REQUIRED  # Configured Type IIS compatibility checks must pass.
    repeats: PREFERRED
    homopolymers: PREFERRED
    forbidden_motifs: PREFERRED
