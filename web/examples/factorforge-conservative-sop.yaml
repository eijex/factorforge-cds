# FactorForge Conservative Sequence Policy (Default Baseline)
#
# 안내 (Guidance):
# FactorForge의 기본 SOP는 사전 합성 안전성을 위한 가장 보수적인 기준선입니다.
# PlantForm의 경험적 지침을 참고하되 100% 동일하게 복제하지 않고, 사전 합성 실패 방지를
# 위해 가장 보수적으로 설정되었습니다.
# 각 연구실 고유의 발현 조건에 맞추어 설정을 변경하거나 맞춤 SOP(.yaml)를 업로드하여 사용하십시오.
#
# ========================================
# SYSTEM / CONTRACT - DO NOT EDIT
# ========================================
$schema: factorforge-sop-v1
profile_id: example_conservative_plant_expression
sop_name: "FactorForge Conservative Sequence Policy Example"
version: 1.2.0
author: Eijex
status: EXAMPLE_TEMPLATE
derived_from: "Eijex FactorForge conservative defaults; collaborator-informed precautionary baseline"
scope_note: "사전 합성 안전 최우선 보수적 기준선. 각 연구실 고유의 SOP 설정을 권장합니다."
default_enforcement: IGNORE
unknown_rule_policy: ERROR

# ========================================
# LABORATORY SETTINGS - EDIT BELOW
# ========================================

# Sequence-review policy: how advisory findings should be classified.
rules:
  # BsaI recognition site
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: HARD_FAIL
  assembly.type_iis.bsai.v1: HARD_FAIL
  # BpiI recognition site
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: HARD_FAIL
  assembly.type_iis.bpii.v1: HARD_FAIL
  # BsmBI recognition site
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: HARD_FAIL
  assembly.type_iis.bsmbi.v1: HARD_FAIL
  # Cryptic splice-like motif
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  # WARNING means the finding is reported for human review.
  rna.cryptic_splice.v1: WARNING
  # PolyA-like motif
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  rna.polya_motifs.v1: WARNING
  # AU-rich element
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  rna.au_rich_elements.v1: WARNING
  # Local GC extreme
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  synthesis.gc_extremes.v1: WARNING
  # Homopolymer
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  policy.synthesis.homopolymer.v1: WARNING
  # Translation initiation MFE
  # Allowed: HARD_FAIL | WARNING | IGNORE
  # Default: WARNING
  policy.initiation_mfe.v1: WARNING

# Optimization-workflow settings are transported in the same v1 file for web
# compatibility, but they are distinct from the sequence-review policy above.
workflow:
  design_method: dp_v2_1_1
  codon_policy: plantform_balanced_codon_v1
  watermark: false
  comparison_methods: [high_cai, gc_target, assembly_friendly]
  sequence_requirements:
    reproducibility_seed: null
    kozak_optimization: false
    suppress_tpa: false
    type_iis_enzymes: [BsaI, BpiI, BsmBI]
    custom_restriction_sites: []
    moclo_template: false
  review_policy:
    cai: PREFERRED
    overall_gc: PREFERRED
    local_gc: PREFERRED
    type_iis: REQUIRED  # Configured Type IIS compatibility checks must pass.
    repeats: PREFERRED
    homopolymers: PREFERRED
    forbidden_motifs: PREFERRED
