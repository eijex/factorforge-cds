name: AgentOS Continuous Scientific Learning Loop

on:
  # No daily schedule here: the AgentOS runner is not shipped in this public repo.
  # Its actual private execution environment must own scheduled learning.
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scout-and-learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run AgentOS Scout & Continuous Learning Cycle
        run: |
          if [ ! -f agentos/learning/cron_runner.py ]; then
            echo "::error::AgentOS runner is not installed in this public repository. Run learning in its configured private AgentOS environment."
            exit 1
          fi
          export PYTHONPATH="src:."
          python agentos/learning/cron_runner.py

      - name: Upload Scientific Learning Logs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-learning-reports
          path: data/scientific_memory/logs/
