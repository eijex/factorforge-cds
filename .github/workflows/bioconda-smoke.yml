name: Bioconda installed package

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - .github/workflows/bioconda-smoke.yml
      - scripts/smoke_installed_distribution.py
      - tests/test_installed_distribution_smoke.py
      - pyproject.toml
      - README.md
      - docs/getting-started.md
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/bioconda-smoke.yml
      - scripts/smoke_installed_distribution.py
      - tests/test_installed_distribution_smoke.py
      - pyproject.toml
      - README.md
      - docs/getting-started.md

permissions:
  contents: read

jobs:
  installed-package:
    name: Public Bioconda / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install public package only
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: reviewer
          create-args: >-
            --override-channels -c conda-forge -c bioconda
            --strict-channel-priority python=3.11 factorforge-cds
          cache-environment: false
          cache-downloads: false
          init-shell: none
          post-cleanup: all
      - name: Exercise installed distribution outside checkout
        shell: micromamba-shell {0}
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py" --output "$RUNNER_TEMP/package-smoke"
      - name: Save results, including failed smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioconda-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/package-smoke/
          if-no-files-found: warn
